version: 2

models:
  - name: customers
    description: Each record represents a customer.
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - unique
          - not_null
      - name: first_name
        description: A customer's first name.
      - name: last_name
        description: A customer's last name.
      - name: count_orders
        description: The number of orders a customer has had all-time.
      - name: first_order_at
        description: The timestamp of a customer's first order.
      - name: most_recent_order_at
        description: The timestamp of a customer's most recent order.

  - name: orders
    description: Each record represents an order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: deliveries
    description: Each record represents a customer's aggregated delivery statistics, including total, successful, failed, and other-status deliveries.
    tests:
      - dbt_utils.expression_is_true:
          expression: "successful_deliveries + failed_deliveries + other_status_deliveries = total_deliveries"
      - dbt_utils.expression_is_true:
          expression: "successful_deliveries >= 0"
      - dbt_utils.expression_is_true:
          expression: "failed_deliveries >= 0"
      - dbt_utils.expression_is_true:
          expression: "other_status_deliveries >= 0"
      - dbt_utils.expression_is_true:
          expression: "total_deliveries >= 1"
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - unique
          - not_null
      - name: total_deliveries
        description: The total number of deliveries associated with the customer across all statuses.
        tests:
          - not_null
      - name: successful_deliveries
        description: The number of deliveries with a status of 'delivered'.
        tests:
          - not_null
      - name: failed_deliveries
        description: The number of deliveries with a status of 'cancelled'.
        tests:
          - not_null
      - name: other_status_deliveries
        description: The number of deliveries with a status other than 'delivered' or 'cancelled'.
        tests:
          - not_null
      - name: last_delivery_date
        description: The timestamp of the customer's most recent successful delivery. Null if the customer has no successful deliveries.